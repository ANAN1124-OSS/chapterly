# 审计修复 #29（O1）：GitHub Actions 固定到提交 SHA 后，用 Dependabot 每周提更新，
# 避免 pin 死后长期不升级、也避免跟浮动的 @v4 标签被上游移动。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # CI-F2（2026-11-24 复核补审）：npm 依赖（Electron / devDependencies）同样每周提更新。
  # 目录、频率、PR 上限与上面的 github-actions 保持一致，避免两条升级通道口径漂移；
  # Electron 版本一旦被提上来，内置 SHASUMS256 与 tests/wp15-supply-chain.test.js 会先红。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
