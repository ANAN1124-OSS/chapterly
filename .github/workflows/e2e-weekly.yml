name: e2e-weekly

# 审计修复 #29（O1）：E2E 与打包冒烟过去只在发版前本地执行（D-4），漏跑就带病出包。
# 这里补上 CI 侧的集成回归拦截：每周定时在真实 Electron 窗口里整跑一次 E2E（临时书库，
# 不碰真实书架）。发版前的 dist:dir / NSIS 冒烟仍按发版门禁在本地执行。
#
# 供应链：所有 actions 固定到提交 SHA（Dependabot 每周提更新），不跟浮动的 @v4 标签；
# 运行镜像固定 windows-2022（不用浮动的 windows-latest）。
# 审计残留修复 R25（#29/O1）：下面三条 pin 的版本注释已按上游 tag 核对（2026-11-15）——checkout /
# setup-node 的提交就是 v4.4.0；pnpm/action-setup 的同一提交上游也标了 v5.0.0，注释取较先发布的 v4.4.0。
on:
  schedule:
    # 每周日 20:17 UTC（周一 04:17 Asia/Shanghai），避开整点拥堵
    - cron: '17 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-2022
    timeout-minutes: 60
    # C5=F3（审计 #24）：engines 声明 node >=22，集成回归不能只测开发机的 24。
    # 与 verify.yml 同一口径补 22 / 24 两档矩阵（fail-fast: false：一档红了另一档仍跑完）。
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # REPO-01：pnpm 先于 setup-node（cache: 'pnpm' 需要现场有 pnpm 才能定位 store）。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # REPO-01：Electron zip 按版本固定 key 缓存；命中后仍由后面的 supply-chain-check
      # 逐字节核对 SHASUMS256，坏缓存 / 被替换的二进制照样红。
      - name: 缓存 Electron 下载（按版本固定 key）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-45.1.0-win32-x64

      - name: 安装依赖（含 Electron 二进制：E2E 要真实窗口）
        run: pnpm install --frozen-lockfile

      # REPO-03（发版 2.1.0 发现）：setup-node 的 pnpm store 缓存命中时，pnpm install 直接从 store
      # 解压 electron，**不会**把 electron-vX.zip 落到 %LOCALAPPDATA%\electron\Cache；而 supply-chain
      # 闸门要求清单里能找到 zip，于是「pnpm 缓存命中 + electron 缓存未命中」这一组合下首次运行必红
      # （2026-11-23 00:56 的 e2e-weekly 就是这条）。
      # 为什么不用「删 dist 重跑 electron 安装脚本」：pnpm 的 node_modules\electron 是指向 store 的
      # 符号链接，PowerShell 递归删除删不掉真实 dist，install.js 见 dist 在就直接返回、zip 永远不下载
      # （2026-11-23 09:05 的手动验证就是这么红的）。所以这里直接从官方 Release 取 zip 放进缓存，
      # 来源是否可信仍由下一步的 supply-chain-check 用内置 SHASUMS256 判定——闸门本身一字未放宽。
      - name: 确保 Electron 压缩包在缓存里（pnpm store 命中时补下载）
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).devDependencies.electron
          $zip = Join-Path $env:LOCALAPPDATA "electron\Cache\electron-v$version-win32-x64.zip"
          if (Test-Path $zip) { Write-Host "已在缓存：$zip"; exit 0 }
          Write-Host "缓存里没有 zip（pnpm store 命中时不会下载），从官方 Release 取一份。"
          $dir = Split-Path $zip
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://github.com/electron/electron/releases/download/v$version/electron-v$version-win32-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if (-not (Test-Path $zip)) { throw "Electron 压缩包下载失败：$url" }
          Write-Host "已补下载：$zip（来源校验交给下一步 supply-chain-check）"

      # WP15 / 审计 E1=O-N2：官方 SHASUMS256.txt 已随仓库入库，这里在跑 E2E 前先核对刚下载的
      # Electron 二进制。镜像被替换 / 构建机被投毒时这一步直接红，不给「坏二进制先跑半小时 E2E」。
      - name: 供应链校验（内置官方 SHASUMS256.txt 核对刚下载的 Electron 二进制）
        run: node scripts/supply-chain-check.js

      - name: 固定时区（E2E 的日期 / 统计断言按 +08 口径）
        run: tzutil /s "China Standard Time"

      - name: 全量 E2E（真实 Electron + 临时书库）
        run: pnpm run e2e
        env:
          TZ: Asia/Shanghai
