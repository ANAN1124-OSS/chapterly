name: e2e-weekly

# 审计修复 #29（O1）：E2E 与打包冒烟过去只在发版前本地执行（D-4），漏跑就带病出包。
# 这里补上 CI 侧的集成回归拦截：每周定时在真实 Electron 窗口里整跑一次 E2E（临时书库，
# 不碰真实书架）。发版前的 dist:dir / NSIS 冒烟仍按发版门禁在本地执行。
#
# 供应链：所有 actions 固定到提交 SHA（Dependabot 每周提更新），不跟浮动的 @v4 标签；
# 运行镜像固定 windows-2022（不用浮动的 windows-latest）。
# 审计残留修复 R25（#29/O1）：下面三条 pin 的版本注释已按上游 tag 核对（2026-11-15）——checkout /
# setup-node 的提交就是 v4.4.0；pnpm/action-setup 的同一提交上游也标了 v5.0.0，注释取较先发布的 v4.4.0。
on:
  schedule:
    # 每周日 20:17 UTC（周一 04:17 Asia/Shanghai），避开整点拥堵
    - cron: '17 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-2022
    timeout-minutes: 60
    # C5=F3（审计 #24）：engines 声明 node >=22，集成回归不能只测开发机的 24。
    # 与 verify.yml 同一口径补 22 / 24 两档矩阵（fail-fast: false：一档红了另一档仍跑完）。
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # REPO-01：pnpm 先于 setup-node（cache: 'pnpm' 需要现场有 pnpm 才能定位 store）。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # REPO-01：Electron zip 按版本固定 key 缓存；命中后仍由后面的 supply-chain-check
      # 逐字节核对 SHASUMS256，坏缓存 / 被替换的二进制照样红。
      - name: 缓存 Electron 下载（按版本固定 key）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-45.1.0-win32-x64

      - name: 安装依赖（含 Electron 二进制：E2E 要真实窗口）
        run: pnpm install --frozen-lockfile

      # REPO-03（发版 2.1.0 发现）：CI 上 electron 的安装脚本没有真正产出二进制——
      # `node_modules\electron\dist\electron.exe` 不存在，zip 也不会落到 %LOCALAPPDATA%\electron\Cache，
      # 于是 supply-chain 闸门报「缓存里没有 zip」或「找不到 electron.exe」。
      # 踩过的两条弯路（都实测红）：
      #   ①「删 dist 重跑 node node_modules/electron/install.js」——pnpm 的 node_modules\electron 是符号
      #     链接，PowerShell 删不掉真实 dist，install.js 见 dist 在就返回；
      #   ②「只下载 zip 进缓存」——zip 有了但 dist 仍缺，闸门的 dist 比对照样红。
      # 现在一次做全：zip 缺失则从官方 Release 取；dist 缺 electron.exe 则用该 zip 解压；补齐 path.txt。
      # 来源可信与否仍由下一步 supply-chain-check 用内置官方 SHASUMS256 + zip↔dist 逐字节比对判定。
      - name: 确保 Electron 二进制就位（zip 缓存 + dist 解压 + path.txt）
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).devDependencies.electron
          $cache = Join-Path $env:LOCALAPPDATA 'electron\Cache'
          $zip = Join-Path $cache "electron-v$version-win32-x64.zip"
          $pkg = 'node_modules\electron'
          $dist = Join-Path $pkg 'dist'
          $exe = Join-Path $dist 'electron.exe'
          if (-not (Test-Path $zip)) {
            Write-Host "缓存里没有 zip，从官方 Release 取一份。"
            New-Item -ItemType Directory -Force -Path $cache | Out-Null
            $url = "https://github.com/electron/electron/releases/download/v$version/electron-v$version-win32-x64.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          }
          if (-not (Test-Path $exe)) {
            Write-Host "dist 里没有 electron.exe（安装脚本没产出），用已下载的 zip 解压。"
            if (Test-Path $dist) { Remove-Item -Recurse -Force $dist -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $dist | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dist -Force
          }
          $pathTxt = Join-Path $pkg 'path.txt'
          if (-not (Test-Path $pathTxt)) { Set-Content -Path $pathTxt -Value 'electron.exe' -NoNewline -Encoding ascii }
          if (-not (Test-Path $exe)) { throw "electron.exe 仍缺失：$exe" }
          Write-Host "Electron 就位：$exe"

      # WP15 / 审计 E1=O-N2：官方 SHASUMS256.txt 已随仓库入库，这里在跑 E2E 前先核对刚下载的
      # Electron 二进制。镜像被替换 / 构建机被投毒时这一步直接红，不给「坏二进制先跑半小时 E2E」。
      - name: 供应链校验（内置官方 SHASUMS256.txt 核对刚下载的 Electron 二进制）
        run: node scripts/supply-chain-check.js

      - name: 固定时区（E2E 的日期 / 统计断言按 +08 口径）
        run: tzutil /s "China Standard Time"

      - name: 全量 E2E（真实 Electron + 临时书库；CI 跳过视觉 / 动效断言）
        run: pnpm run e2e
        env:
          TZ: Asia/Shanghai
          # 发版 2.1.0 的 CI 适配（REPO-03 后续）：hosted runner 没有交互式桌面会话，Chromium 对不可见
          # 窗口节流合成 / 动画 / 布局，动效 / 主题 / 几何测量类断言在那里必然偏（2026-11-23 实测 30 项）。
          # 这些断言（44 处 checkVisual，运行时展开 50 项）在本地与发版前的全量 E2E 里照常跑；CI 只跳过它们，
          # 功能断言与供应链闸门仍全部阻塞。跳过面由 scripts/e2e/visual-assertions.js 的静态清单约束
          # （wiring-check 的 e2e-visual-assertions 契约）：不许把功能断言挪进 checkVisual 换绿灯。
          E2E_SKIP_VISUAL: '1'

      # T-25（三次审查 · 低）：定时任务失败时 hosted runner 也会销毁，只有一行临时目录路径没法诊断。
      # 失败时把本次 E2E 的临时目录（userdata 日志 / 演练书库）传成 artifact；数据全是自造的。
      - name: 失败现场（E2E 临时目录 / 日志）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-weekly-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cw-e2e-*
          if-no-files-found: warn
          retention-days: 7
