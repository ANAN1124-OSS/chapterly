name: verify

# 章回 / Chapterly 的最小验证 CI（1.7.0 G1b；1.8.0 WP-35 起加入 eslint，WP-36 把两条规则都收为 error）。
# 应用是 Windows 桌面工具：单测里含 Windows 路径 / GBK / UNC 语义，ubuntu 跑会假红，所以只挂 windows。
# 只做四件事：全量语法检查、单测、eslint（no-undef / no-unused-vars 均为 error）、无障碍静态门禁。
# 审计修复 #29（O1）：运行镜像固定 windows-2022（不用浮动的 windows-latest），所有 actions 固定到
# 提交 SHA（Dependabot 每周提更新）；E2E 不进本工作流（要起 Electron 真窗口，另有每周定时的
# .github/workflows/e2e-weekly.yml），打包冒烟仍按发版门禁在发版前本地执行（D-4）。
# 审计残留修复 R25（#29/O1）：下面三条 pin 的版本注释已按上游 tag 核对（2026-11-15）——checkout /
# setup-node 的提交就是 v4.4.0；pnpm/action-setup 的同一提交上游也标了 v5.0.0，注释取较先发布的 v4.4.0。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    # 审计修复 #56（O4）：engines 写的是 node >=22，而这里只测 24 —— CI 与声明口径不一致。
    # 补 22 / 24 两档矩阵（fail-fast: false：一档红了另一档仍跑完，便于判断是否只挂旧版本）。
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # REPO-01（2026-11-21 第五轮审计）：pnpm 必须先于 setup-node —— setup-node 的
      # cache: 'pnpm' 要现场执行 `pnpm store path` 才能定位缓存目录，顺序反了会直接报
      # 「Unable to locate executable file: pnpm」。store 按 pnpm-lock.yaml 哈希命中，
      # 安装阶段不用每次从 registry 重下整棵依赖树。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.11.2
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖（以锁文件为准）
        run: pnpm install --frozen-lockfile
        env:
          # 单测与静态门禁都不需要 Electron 二进制，跳过下载省掉 100 MB+ 与镜像不确定性
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: 全量语法检查（node --check）
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r f; do
            node --check "$f"
            count=$((count + 1))
          done < <(git ls-files '*.js')
          echo "node --check 通过：$count 个文件"

      - name: 固定时区（ZIP 的 DOS 时间戳按本地时区编码；两处逐字节黄金值要与开发机 +08 同口径）
        run: tzutil /s "China Standard Time"

      - name: 单测
        run: npm test
        env:
          TZ: Asia/Shanghai

      - name: eslint（no-undef / no-unused-vars 均为 error）
        run: npx eslint .

      - name: 无障碍静态门禁
        run: node scripts/a11y-gate.js --static
