name: e2e-pr

# 审计 #19 / F1：PR 级路径过滤 E2E。
# 背景：UI 时序 / 真实 DOM 行为过去只有每周定时的 e2e-weekly.yml 兜底，回归窗口最长 7 天。
# 这里在 PR 改动 renderer/** / core/** / ipc/** / main.js / preload.js（以及 E2E 基建与依赖清单）时，
# 立刻在真实 Electron 窗口里整跑一次全量 E2E；每周全量仍由 e2e-weekly.yml 保留。
# T-27（三次审查）：**push 到 main 也触发**（同一份 paths 过滤）——此前直推 main 的产品改动只过
# verify（无 E2E），只有 PR 路径有门禁，直推等于裸奔；回归窗口最长 7 天。
# 触发路径的唯一事实源是 scripts/e2e-scope.js 的 E2E_TRIGGER_PATHS（push 分支的唯一事实源是同文件的
# E2E_PUSH_BRANCHES）—— 改这里必须同步改那里（tests/wp16-regression.test.js 会逐项核对，漏一处就是假拦截）。
# 供应链 / 镜像 / action pin 口径与 e2e-weekly.yml 一致：不跟浮动标签，镜像固定 windows-2022。
on:
  pull_request:
    paths:
      - 'renderer/**'
      - 'core/**'
      - 'ipc/**'
      - 'main.js'
      - 'preload.js'
      - 'scripts/e2e/**'
      - 'scripts/e2e-scenario.js'
      - 'scripts/run-e2e.js'
      - 'scripts/start.js'
      - 'scripts/e2e-runner-logic.js'
      - 'scripts/screenshot-driver.js'
      - 'scripts/driver-poll.js'
      - 'scripts/e2e-politeness.js'
      - 'scripts/e2e-stats-seed.js'
      - 'scripts/export-check.js'
      - 'scripts/start-logic.js'
      - '.github/workflows/e2e-pr.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'renderer/**'
      - 'core/**'
      - 'ipc/**'
      - 'main.js'
      - 'preload.js'
      - 'scripts/e2e/**'
      - 'scripts/e2e-scenario.js'
      - 'scripts/run-e2e.js'
      - 'scripts/start.js'
      - 'scripts/e2e-runner-logic.js'
      - 'scripts/screenshot-driver.js'
      - 'scripts/driver-poll.js'
      - 'scripts/e2e-politeness.js'
      - 'scripts/e2e-stats-seed.js'
      - 'scripts/export-check.js'
      - 'scripts/start-logic.js'
      - '.github/workflows/e2e-pr.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # REPO-01：pnpm 先于 setup-node（cache: 'pnpm' 需要现场有 pnpm 才能定位 store）。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
          run_install: false

      # REPO-02（审计）：这一档**只跑 Node 24** —— 全量 E2E 约 60 分钟，PR 上铺 22/24 双档会把预算翻倍。
      # engines >=22 的 22 档由 e2e-weekly.yml 的 22/24 矩阵兜底（回归窗口最长 7 天），
      # 静态 / 单测口径的 22 档由 verify.yml 的矩阵兜底。改这里请同步 README 的 CI 一节。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # REPO-01：Electron zip 按版本固定 key 缓存；命中后仍由下一步逐字节核对 SHASUMS，
      # 坏缓存照样红，供应链门禁不因缓存而放松。
      - name: 缓存 Electron 下载（按版本固定 key）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-45.1.0-win32-x64

      - name: 安装依赖（含 Electron 二进制：E2E 要真实窗口）
        run: pnpm install --frozen-lockfile

      # REPO-03（发版 2.1.0 发现）：与 e2e-weekly 同因修复——CI 上 electron 安装脚本没产出二进制，
      # dist\electron.exe 与 zip 缓存都缺，supply-chain 闸门必然红。这里一次做全：zip 缺失则从官方
      # Release 取；dist 缺 exe 则解压；补 path.txt。来源可信与否仍由下一步的内置 SHASUMS256 判定，
      # 闸门本身一字未放宽。
      - name: 确保 Electron 二进制就位（zip 缓存 + dist 解压 + path.txt）
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).devDependencies.electron
          $cache = Join-Path $env:LOCALAPPDATA 'electron\Cache'
          $zip = Join-Path $cache "electron-v$version-win32-x64.zip"
          $pkg = 'node_modules\electron'
          $dist = Join-Path $pkg 'dist'
          $exe = Join-Path $dist 'electron.exe'
          if (-not (Test-Path $zip)) {
            Write-Host "缓存里没有 zip，从官方 Release 取一份。"
            New-Item -ItemType Directory -Force -Path $cache | Out-Null
            $url = "https://github.com/electron/electron/releases/download/v$version/electron-v$version-win32-x64.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          }
          if (-not (Test-Path $exe)) {
            Write-Host "dist 里没有 electron.exe（安装脚本没产出），用已下载的 zip 解压。"
            if (Test-Path $dist) { Remove-Item -Recurse -Force $dist -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $dist | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dist -Force
          }
          $pathTxt = Join-Path $pkg 'path.txt'
          if (-not (Test-Path $pathTxt)) { Set-Content -Path $pathTxt -Value 'electron.exe' -NoNewline -Encoding ascii }
          if (-not (Test-Path $exe)) { throw "electron.exe 仍缺失：$exe" }
          Write-Host "Electron 就位：$exe"

      # WP15 / 审计 E1=O-N2：与 weekly 同口径，先核对刚下载的 Electron 二进制再跑 E2E。
      - name: 供应链校验（内置官方 SHASUMS256.txt 核对刚下载的 Electron 二进制）
        run: node scripts/supply-chain-check.js

      - name: 固定时区（E2E 的日期 / 统计断言按 +08 口径）
        run: tzutil /s "China Standard Time"

      - name: 全量 E2E（真实 Electron + 临时书库；CI 跳过视觉 / 动效断言）
        run: pnpm run e2e
        env:
          TZ: Asia/Shanghai
          # 与 e2e-weekly 同口径：hosted runner 无交互式桌面会话，44 处 checkVisual（动效 / 主题 / 几何
          # 测量）在 CI 跳过（运行时展开 50 项）；功能与供应链断言仍全部阻塞。跳过面由
          # scripts/e2e/visual-assertions.js 的静态清单约束（wiring-check 的 e2e-visual-assertions 契约）。
          E2E_SKIP_VISUAL: '1'
          # T-25 现场上传：artifact 的路径是 ${{ runner.temp }}/cw-e2e-*，而 Node 的 os.tmpdir() 在
          # hosted Windows runner 上默认解析到 C:\Users\...\AppData\Local\Temp（≠ RUNNER_TEMP），
          # 两处对不上时上传会「No files were found」。把 TEMP/TMP 指到 runner.temp，失败现场才传得上去。
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      # T-25（三次审查 · 低）：hosted runner 用后即毁，E2E 失败时只留一行临时目录路径等于没法排查。
      # 失败时把本次 E2E 的临时目录（userdata 日志 / 演练书库）传成 artifact；数据全是自造的，无泄露面。
      # 动作与其余 action 一样 SHA pin（Dependabot 每周提更新）。
      - name: 失败现场（E2E 临时目录 / 日志）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-pr-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cw-e2e-*
          if-no-files-found: warn
          retention-days: 7
