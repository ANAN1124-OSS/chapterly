name: e2e-pr

# 审计 #19 / F1：PR 级路径过滤 E2E。
# 背景：UI 时序 / 真实 DOM 行为过去只有每周定时的 e2e-weekly.yml 兜底，回归窗口最长 7 天。
# 这里在 PR 改动 renderer/** / core/** / ipc/** / main.js / preload.js（以及 E2E 基建与依赖清单）时，
# 立刻在真实 Electron 窗口里整跑一次全量 E2E；每周全量仍由 e2e-weekly.yml 保留。
# 触发路径的唯一事实源是 scripts/e2e-scope.js 的 E2E_TRIGGER_PATHS —— 改这里必须同步改那里
# （tests/wp16-regression.test.js 会逐项核对，漏一处就是假拦截）。
# 供应链 / 镜像 / action pin 口径与 e2e-weekly.yml 一致：不跟浮动标签，镜像固定 windows-2022。
on:
  pull_request:
    paths:
      - 'renderer/**'
      - 'core/**'
      - 'ipc/**'
      - 'main.js'
      - 'preload.js'
      - 'scripts/e2e/**'
      - 'scripts/e2e-scenario.js'
      - 'scripts/run-e2e.js'
      - 'scripts/start.js'
      - 'scripts/e2e-runner-logic.js'
      - 'scripts/screenshot-driver.js'
      - 'scripts/driver-poll.js'
      - 'scripts/e2e-politeness.js'
      - 'scripts/e2e-stats-seed.js'
      - 'scripts/export-check.js'
      - 'scripts/start-logic.js'
      - '.github/workflows/e2e-pr.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # REPO-01：pnpm 先于 setup-node（cache: 'pnpm' 需要现场有 pnpm 才能定位 store）。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.11.2
          run_install: false

      # REPO-02（审计）：这一档**只跑 Node 24** —— 全量 E2E 约 60 分钟，PR 上铺 22/24 双档会把预算翻倍。
      # engines >=22 的 22 档由 e2e-weekly.yml 的 22/24 矩阵兜底（回归窗口最长 7 天），
      # 静态 / 单测口径的 22 档由 verify.yml 的矩阵兜底。改这里请同步 README 的 CI 一节。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # REPO-01：Electron zip 按版本固定 key 缓存；命中后仍由下一步逐字节核对 SHASUMS，
      # 坏缓存照样红，供应链门禁不因缓存而放松。
      - name: 缓存 Electron 下载（按版本固定 key）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-45.1.0-win32-x64

      - name: 安装依赖（含 Electron 二进制：E2E 要真实窗口）
        run: pnpm install --frozen-lockfile

      # WP15 / 审计 E1=O-N2：与 weekly 同口径，先核对刚下载的 Electron 二进制再跑 E2E。
      - name: 供应链校验（内置官方 SHASUMS256.txt 核对刚下载的 Electron 二进制）
        run: node scripts/supply-chain-check.js

      - name: 固定时区（E2E 的日期 / 统计断言按 +08 口径）
        run: tzutil /s "China Standard Time"

      - name: 全量 E2E（真实 Electron + 临时书库）
        run: pnpm run e2e
        env:
          TZ: Asia/Shanghai
